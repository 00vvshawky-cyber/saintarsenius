<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>اختيار الدور — مدرسة القديس أرسانيوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:Cairo,sans-serif; background:#fbf9f5; color:#1b1c1a;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08);
          padding:32px 24px; width:100%; max-width:390px; text-align:center; }
  h1 { font-family:'Noto Serif',serif; font-size:22px; margin:0 0 6px; }
  .muted { color:#6E6058; font-size:14px; margin:0 0 20px; }
  .roles { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .role-btn { width:100%; height:52px; border:0; border-radius:12px; cursor:pointer;
              font-family:Cairo,sans-serif; font-size:16px; font-weight:700;
              background:#491402; color:#fff; box-shadow:0 4px 12px rgba(73,20,2,.25);
              transition:transform .1s; }
  .role-btn:active { transform:scale(.99); }
  .role-btn:disabled { opacity:.6; }
  .logout { background:#ffdad6; color:#93000a; box-shadow:none; font-size:14px; height:44px; }
</style>
</head>
<body>
<main class="card">
  <h1>اختر الدور المطلوب</h1>
  <p class="muted" id="welcome">حسابك يمتلك أكثر من دور</p>
  <div class="roles" id="roleList"></div>
  <button class="role-btn logout" onclick="logout()">تسجيل الخروج</button>
</main>
<script src="app.js"></script>
<script>
  (async () => {
    let me = null;
    try {
      me = await api('/auth/me');
      saveSession({ user: me.user, roles: me.roles, active_role: me.active_role });
    } catch (e) {
      clearSession();
      location.href = 'index.html';
      return;
    }
    document.getElementById('welcome').textContent = 'أهلاً ' + me.user.full_name + ' — حسابك يمتلك أكثر من دور';

    const list = document.getElementById('roleList');
    (me.roles || []).forEach((role) => {
      const btn = document.createElement('button');
      btn.className = 'role-btn';
      btn.textContent = ROLE_LABEL[role] || role;
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          await api('/auth/switch-role', { method: 'POST', body: { role: role } });
          location.href = ROLE_HOME[role] || 'index.html';
        } catch (err) {
          btn.disabled = false;
          toast(err.message || 'تعذر تبديل الدور');
        }
      };
      list.appendChild(btn);
    });
  })();
</script>
</body>
</html>
