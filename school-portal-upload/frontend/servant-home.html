<script src="app.js"></script>
<script>
  /* ===== لوحة الفصل — 8 بطاقات (T056) — ربط كامل بالباك إند =====
     • GET /servant/classes                → اسم الفصل وعدد تلاميذه
     • GET /points/bonus/budget             → رصيد البونص الأسبوعي
     • GET /followups?class_code=…          → عدد المفقودين
     • GET /attendance/qr/current           → (شاشة الـ QR عند فتحها) */
  const $ = (id) => document.getElementById(id);

  /* الشاشة المقابلة لكل بطاقة (تُفعَّل تباعًا مع بناء كل شاشة) */
  const SCREENS = {
    students:   { page: 'servant-students.html',   label: 'طلابي' },
    grades:     { page: 'servant-grades.html',     label: 'الدرجات' },
    assessments:{ page: 'servant-assessments.html',label: 'إدارة التسميع والامتحانات' },
    content:    { page: 'servant-content.html',    label: 'إدارة المحتوى' },
    followup:   { page: 'servant-followup.html',   label: 'الحضور والافتقاد' },
    liturgy:    { page: 'servant-liturgy.html',    label: 'قداس الجمعة' },
    bonus:      { page: 'servant-bonus.html',      label: 'البونص والخصم' },
    qr:         { page: 'servant-qr.html',         label: 'شاشة الـ QR' },
  };
  /* الشاشات المبنية حتى الآن (تُحدَّث مع كل شاشة جديدة) */
  const BUILT = { students: true, grades: true, assessments: true, content: true,
                  followup: true, liturgy: true, bonus: true, qr: true };

  function toDigits(value) {
    return String(value == null ? '' : value);
  }

  function showToast(msg) {
    if (typeof toast === 'function') toast(msg, 'info');
  }

  function classCode() {
    const url = new URLSearchParams(location.search).get('class');
    if (url) return url;
    try { return sessionStorage.getItem('servant_class_code') || ''; } catch (e) { return ''; }
  }

  async function boot() {
    const me = await requireAuth(['servant', 'admin']);
    if (!me) return;
    $('servantName').textContent = (me.user && me.user.full_name) || '';

    const code = classCode();
    let cls = null;
    let studentCount = null;
    let classCount = 0;
    try {
      const res = await api('/servant/classes');
      const list = res.data || res;
      classCount = Array.isArray(list) ? list.length : 0;
      cls = list.find(c => c.code === code) || null;
      if (cls && cls.student_count !== undefined) studentCount = cls.student_count;
    } catch (e) { /* تجاهل */ }
    $('classTitle').textContent = cls ? cls.name_ar : (code || 'لوحة الفصل');

    // عدد التلاميذ
    if (studentCount === null && code) {
      try {
        const res = await api('/servant/classes/' + encodeURIComponent(code) + '/students');
        studentCount = (res.data || res).length;
      } catch (e) { /* تجاهل */ }
    }
    $('studentsBadge').textContent = toDigits(studentCount === null ? 0 : studentCount) + ' تلميذ';

    // رصيد البونص الأسبوعي (مواد هذا الفصل فقط — ما يهم الخادم هنا)
    try {
      const res = await api('/points/bonus/budget' + (code ? '?class_code=' + encodeURIComponent(code) : ''));
      const budget = res.data || res;
      const total = budget.reduce((s, b) => s + Number(b.total || 0), 0);
      const remaining = budget.reduce((s, b) => s + Number(b.remaining || 0), 0);
      $('bonusBalance').textContent = toDigits(remaining) + ' / ' + toDigits(total);
    } catch (e) {
      $('bonusBalance').textContent = '— / —';
    }

    // عدد المفقودين (قائمة الافتقاد)
    if (code) {
      try {
        const res = await api('/followups?class_code=' + encodeURIComponent(code));
        const list = res.data || res;
        const n = list.length;
        $('absentCount').textContent = toDigits(n);
        $('absentBadge').classList.toggle('hidden', n === 0);
      } catch (e) { /* تجاهل */ }
    }

    // «تغيير الفصل» أو «تسجيل الخروج» (إن كان فصل واحد فقط)
    const changeBtn = $('changeClassBtn');
    if (changeBtn) {
      if (classCount <= 1) {
        changeBtn.innerHTML = '<span class="material-symbols-outlined text-[17px] text-semantic-error">logout</span><span class="">تسجيل الخروج</span>';
        changeBtn.classList.remove('text-primary');
        changeBtn.classList.add('text-semantic-error');
        changeBtn.addEventListener('click', function () { logout(); });
      } else {
        changeBtn.addEventListener('click', function () {
          location.href = 'servant-classes.html';
        });
      }
    }

    // البطاقات الثماني
    document.querySelectorAll('[data-card]').forEach(function (el) {
      const key = el.getAttribute('data-card');
      const screen = SCREENS[key];
      if (!screen) return;
      const card = el.closest('button');
      if (!card) return;
      card.addEventListener('click', function () {
        if (BUILT[key]) {
          location.href = screen.page + (code ? '?class=' + encodeURIComponent(code) : '');
        } else {
          showToast('شاشة «' + screen.label + '» قيد الإنشاء');
        }
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

</script>
