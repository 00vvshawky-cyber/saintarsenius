<!DOCTYPE html><html dir="rtl" lang="ar" style=""><head><meta charset="utf-8"><meta name="description" content="إشعارات مدرسة القديس أرسانيوس للألحان"><title>الإشعارات - مدرسة القديس أرسانيوس للألحان</title><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&amp;family=Noto+Serif:wght@600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@100..900&amp;family=Noto+Serif:wght@100..900&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fbf9f5;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-variant": "#e4e2de", "secondary": "#855300", "on-surface": "#1b1c1a", "outline-variant": "#d9c1ba", "primary-container": "#662914", "on-tertiary-container": "#cd7658", "on-error": "#ffffff", "on-primary-fixed-variant": "#74341d", "tertiary-fixed": "#ffdbcf", "tertiary-container": "#69270d", "surface-bright": "#fbf9f5", "on-primary": "#ffffff", "secondary-fixed": "#ffddb8", "on-background": "#1b1c1a", "primary-fixed": "#ffdbd0", "on-tertiary-fixed-variant": "#763219", "on-secondary-container": "#754900", "semantic-success": "#2E7D32", "on-surface-variant": "#54433e", "on-primary-container": "#e79073", "surface-container-highest": "#e4e2de", "inverse-primary": "#ffb59d", "on-secondary-fixed": "#2a1700", "secondary-fixed-dim": "#fdb965", "error": "#ba1a1a", "tertiary-fixed-dim": "#ffb59c", "primary-fixed-dim": "#ffb59d", "surface-container": "#efeeea", "audio-scrubber-track": "#E2DACF", "text-primary": "#2B1E1A", "semantic-error": "#C62828", "semantic-disabled": "#BDBDBD", "on-tertiary": "#ffffff", "on-primary-fixed": "#390b00", "surface-dim": "#dbdad6", "semantic-warning": "#E65100", "error-container": "#ffdad6", "surface-container-high": "#eae8e4", "outline": "#87736d", "on-secondary-fixed-variant": "#653e00", "text-secondary": "#6E6058", "inverse-on-surface": "#f2f0ed", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff", "surface-tint": "#914b32", "on-tertiary-fixed": "#390c00", "primary": "#270600", "surface-subtle": "F4EFEA", "inverse-surface": "#30312e", "surface-container-low": "#f5f3ef", "background": "#fbf9f5", "surface": "#FFFFFF", "border-focused": "#C88A36", "on-error-container": "#93000a", "border-warm": "#E6DFD5", "tertiary": "#270600", "secondary-container": "#fdb965" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter-tablet": "1.5rem", "margin-desktop": "2.5rem", "margin-tablet": "1.5rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "gutter": "1rem", "space-md": "1rem", "space-xl": "2rem", "margin": "1rem", "space-xs": "0.25rem" }, "fontFamily": { "headline-md": ["Noto Serif"], "label-lg": ["Cairo"], "body-md": ["Cairo"], "label-md": ["Cairo"], "body-lg": ["Cairo"], "display-lg": ["Noto Serif"], "title-lg": ["Cairo"], "body-sm": ["Cairo"], "headline-lg": ["Noto Serif"], "label-sm": ["Cairo"], "title-md": ["Cairo"] }, "fontSize": { "headline-md": ["22px", { "lineHeight": "32px", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "body-md": ["15px", { "lineHeight": "24px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-lg": ["17px", { "lineHeight": "28px", "fontWeight": "500" }], "display-lg": ["32px", { "lineHeight": "44px", "fontWeight": "700" }], "title-lg": ["18px", { "lineHeight": "28px", "fontWeight": "700" }], "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg": ["26px", { "lineHeight": "36px", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "400" }], "title-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };</script></head>
<body class="bg-background font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-secondary-container selection:text-on-secondary-container">

<!-- Header -->
<header class="fixed top-0 w-full z-50 pt-safe bg-background/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(73,20,2,0.04)]">
  <div class="h-16 px-margin flex items-center justify-between">
    <div class="flex items-center gap-space-xs">
      <button aria-label="الرجوع" class="w-11 h-11 flex items-center justify-center rounded-lg text-primary hover:bg-surface-container-low transition-colors" onclick="history.back()" type="button">
        <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
      </button>
      <div class="flex flex-col">
        <h1 class="font-title-lg text-title-lg text-primary truncate leading-tight">الإشعارات</h1>
        <span class="text-[11px] font-medium text-text-secondary leading-tight">مدرسة القديس أرسانيوس للألحان</span>
      </div>
    </div>
    <div class="flex items-center gap-space-sm">
      <button aria-label="تحديث" class="w-9 h-9 rounded-full flex items-center justify-center text-text-secondary hover:bg-surface-container-low active:scale-95 transition-all" id="refreshBtn" type="button">
        <span class="material-symbols-outlined text-[20px]">refresh</span>
      </button>
      <img alt="شعار مدرسة القديس أرسانيوس" class="w-8 h-8 rounded-full object-cover" id="schoolLogo" onerror="this.style.display='none'" src="assets/logo.png">
    </div>
  </div>
</header>

<main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-background px-margin">
  <div class="flex flex-col w-full pb-8 space-y-3">

    <!-- Summary card: عدد غير المقروء + تعليم الكل -->
    <div class="w-full rounded-xl bg-gradient-to-br from-[#dfa956] via-[#C88A36] to-[#b37424] p-[1px] shadow-md">
      <div class="w-full bg-gradient-to-b from-[#FFFDF9] via-[#FAF4EA] to-[#F5ECE0] rounded-[11px] p-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-11 h-11 rounded-xl bg-secondary-container/40 flex items-center justify-center text-secondary shadow-sm shrink-0">
            <span class="material-symbols-outlined text-[24px]">notifications_active</span>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="font-headline-lg text-headline-lg text-primary tracking-tight font-bold" id="unreadCount">0</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant leading-tight" id="unreadLabel">إشعار غير مقروء</span>
          </div>
        </div>
        <button class="px-3 py-2 rounded-lg bg-primary-container text-on-primary font-label-md text-label-md font-bold shadow-sm active:scale-95 transition-all disabled:opacity-40 disabled:active:scale-100" id="markAllBtn" type="button" disabled>
          تعليم الكل كمقروء
        </button>
      </div>
    </div>

    <!-- WhatsApp channel (FR-NTF-01) -->
    <div class="w-full bg-surface-container-lowest rounded-xl p-4 shadow-sm border border-[#E6DFD5] flex items-center gap-3" id="channelCard">
      <div class="w-11 h-11 rounded-xl bg-[#25D366]/10 text-[#25D366] flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-[24px]">forum</span>
      </div>
      <div class="flex flex-col flex-1 min-w-0">
        <span class="font-title-md text-title-md text-primary font-bold">قناة واتساب المدرسة</span>
        <span class="font-body-sm text-body-sm text-on-surface-variant leading-tight" id="channelNote">للتواصل المباشر وإعلانات الإدارة</span>
      </div>
      <a class="px-3 py-2 rounded-lg bg-surface-container text-primary font-label-md text-label-md font-bold hover:bg-surface-container-high active:scale-95 transition-all shrink-0" id="channelLink" href="#" target="_blank" rel="noopener">فتح القناة</a>
    </div>

    <!-- Section title -->
    <div class="flex items-center justify-between px-1 pt-1">
      <div class="flex items-center gap-1.5">
        <span class="w-1.5 h-4 bg-border-focused rounded-full inline-block"></span>
        <h2 class="font-title-md text-title-md text-primary font-bold">كل الإشعارات</h2>
      </div>
      <span class="font-label-sm text-label-sm text-text-secondary" id="totalLabel">0 إشعار</span>
    </div>

    <!-- Notifications list -->
    <div class="flex flex-col gap-2.5" id="notifList"></div>

    <!-- Empty state -->
    <div class="flex-col items-center justify-center py-12 px-4 text-center rounded-xl border border-dashed border-border-warm bg-surface-container/40 hidden" id="emptyState">
      <div class="w-16 h-16 rounded-full bg-surface-container-lowest border border-border-warm flex items-center justify-center text-text-secondary mb-3 shadow-xs">
        <span class="material-symbols-outlined text-[32px] text-outline">notifications_off</span>
      </div>
      <h3 class="font-title-md text-title-md text-primary font-bold mb-1">لا توجد إشعارات</h3>
      <p class="font-body-sm text-body-sm text-text-secondary max-w-xs leading-relaxed">سيصلك هنا كل ما يرسله مدير المدرسة أو خادم المادة لفصلك.</p>
    </div>

  </div>
</main>

<script src="app.js"></script>
<script>
  /* ===== الإشعارات — ربط كامل بالباك إند =====
     • GET  /student/notifications          → القناة + القائمة + غير المقروء
     • POST /student/notifications/{id}/read → تعليم إشعار كمقروء
     (FR-NTF-01 · FR-NTF-02) */
  const $ = (id) => document.getElementById(id);

  let DATA = { items: [], unread_count: 0, whatsapp_channel_url: null };

  function toDigits(value) {
    return String(value == null ? '' : value);
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function plural(n, one, two, many) {
    if (n === 1) return one;
    if (n === 2) return two;
    return many;
  }

  /* وقت نسبي بالعربية */
  function timeAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const diff = Date.now() - d.getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'الآن';
    if (min < 60) return 'منذ ' + toDigits(min) + ' ' + plural(min, 'دقيقة', 'دقيقتين', 'دقائق');
    const hours = Math.floor(min / 60);
    if (hours < 24) return 'منذ ' + toDigits(hours) + ' ' + plural(hours, 'ساعة', 'ساعتين', 'ساعات');
    const days = Math.floor(hours / 24);
    if (days === 1) return 'أمس';
    if (days < 7) return 'منذ ' + toDigits(days) + ' ' + plural(days, 'يوم', 'يومين', 'أيام');
    try {
      return d.toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Africa/Cairo' });
    } catch (e) { return ''; }
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    try {
      return d.toLocaleString('ar-EG-u-nu-latn', {
        day: 'numeric', month: 'long', year: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Africa/Cairo'
      });
    } catch (e) { return ''; }
  }

  /* ---------- بطاقة إشعار ---------- */
  function notificationCard(item) {
    const el = document.createElement('article');
    el.className = 'w-full bg-surface-container-lowest rounded-xl p-4 shadow-sm border flex items-start gap-3 relative transition-all active:scale-[0.99] ' +
      (item.unread
        ? 'border-secondary/50 bg-secondary-container/12'
        : 'border-[#E6DFD5]');
    el.setAttribute('data-id', item.id);
    el.innerHTML =
      '<div class="w-9 h-9 rounded-xl bg-surface-container text-secondary flex items-center justify-center shrink-0">' +
        '<span class="material-symbols-outlined text-[20px]">campaign</span>' +
      '</div>' +
      '<div class="flex-1 min-w-0 flex flex-col gap-1">' +
        '<div class="flex items-start justify-between gap-2">' +
          '<h3 class="font-title-md text-title-md text-primary font-bold leading-snug">' + esc(item.title) + '</h3>' +
          '<span class="font-label-sm text-label-sm text-text-secondary shrink-0 whitespace-nowrap">' + timeAgo(item.created_at) + '</span>' +
        '</div>' +
        '<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">' + esc(item.body) + '</p>' +
      '</div>' +
      (item.unread ? '<span class="absolute -top-1 -left-1 w-2.5 h-2.5 rounded-full bg-semantic-error shadow-sm" title="غير مقروء"></span>' : '');
    return el;
  }

  /* ---------- العرض ---------- */
  function render() {
    const list = $('notifList');
    list.innerHTML = '';
    const items = DATA.items || [];
    const unread = DATA.unread_count || 0;

    $('unreadCount').textContent = toDigits(unread);
    $('unreadLabel').textContent = unread
      ? plural(unread, 'إشعار غير مقروء', 'إشعاران غير مقروءين', 'إشعارات غير مقروءة')
      : 'لا توجد إشعارات جديدة';
    $('totalLabel').textContent = toDigits(items.length) + ' ' + plural(items.length, 'إشعار', 'إشعاران', 'إشعارات');
    $('markAllBtn').disabled = unread === 0;

    items.forEach(function (it) { list.appendChild(notificationCard(it)); });

    $('emptyState').classList.toggle('hidden', items.length > 0);
    $('emptyState').classList.toggle('flex', items.length === 0);
  }

  function renderChannel() {
    const url = DATA.whatsapp_channel_url;
    const safeUrl = typeof url === 'string' && /^https?:\/\//i.test(url) ? url : '';
    const link = $('channelLink');
    if (safeUrl) {
      link.href = safeUrl;
      link.classList.remove('hidden');
      $('channelNote').textContent = 'رسائل الإدارة وإعلانات المدرسة';
    } else {
      link.classList.add('hidden');
      $('channelNote').textContent = url
        ? 'رابط قناة واتساب غير صالح — تواصل مع إدارة المدرسة'
        : 'لم يتم تحديد قناة واتساب بعد — اسأل خادم المادة';
    }
  }

  /* ---------- تعليم إشعار كمقروء ---------- */
  async function markRead(id) {
    try {
      await api('/student/notifications/' + id + '/read', { method: 'POST' });
      const item = (DATA.items || []).find(function (i) { return String(i.id) === String(id); });
      if (item) item.unread = 0;
      DATA.unread_count = Math.max(0, (DATA.unread_count || 1) - 1);
      render();
    } catch (e) {
      toast((e && e.message) || 'تعذر تحديث الإشعار');
    }
  }

  async function markAllRead() {
    const unread = (DATA.items || []).filter(function (i) { return i.unread; });
    if (!unread.length) return;
    for (const it of unread) {
      try { await api('/student/notifications/' + it.id + '/read', { method: 'POST' }); } catch (e) { /* نكمل */ }
    }
    await load();
    toast('تم تعليم كل الإشعارات كمقروءة');
  }

  /* ---------- التحميل ---------- */
  async function load() {
    const res = await api('/student/notifications');
    DATA = res.data || res;
    render();
    renderChannel();
  }

  /* ---------- الربط ---------- */
  async function boot() {
    const me = await requireAuth(['student']);
    if (!me) return;
    try {
      await load();
    } catch (e) {
      toast((e && e.message) || 'تعذر تحميل الإشعارات');
    }
    $('notifList').addEventListener('click', function (ev) {
      const card = ev.target.closest('article[data-id]');
      if (!card) return;
      const id = card.getAttribute('data-id');
      const item = (DATA.items || []).find(function (i) { return String(i.id) === String(id); });
      if (item && item.unread) markRead(id);
    });
    $('markAllBtn').addEventListener('click', markAllRead);
    $('refreshBtn').addEventListener('click', function () {
      load();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
</script>
</body>
</html>
